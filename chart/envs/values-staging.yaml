environment: staging
appEnvironment: staging

ingress:
  host: fastapi-staging.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-staging

backend:
  image:
    tag: "backend-f0464290"   # ci:backend-tag
  replicas: 2
frontend:
  image:
    tag: "frontend-f0464290"   # ci:frontend-tag
  replicas: 2

adminer:
  enabled: false

database:
  storage:
    size: 2Gi
    hostPath: /data/postgresql-staging
  backup:
    enabled: true

secrets:
  create: false
