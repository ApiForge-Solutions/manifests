environment: prod
appEnvironment: production

ingress:
  host: fastapi-prod.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-prod
backend:
  image:
    tag: "backend" # ci:backend-tag
  replicas: 2
frontend:
  image:
    tag: "frontend" # ci:frontend-tag
  replicas: 2

adminer:
  enabled: false
database:
  storage:
    size: 5Gi
    hostPath: /data/postgresql-prod

secrets:
  create: false
