environment: qa
appEnvironment: staging

ingress:
  host: fastapi-qa.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-staging

backend:
  image:
    tag: "backend-f0464290"   # ci:backend-tag
  replicas: 1
frontend:
  image:
    tag: "frontend-f0464290"   # ci:frontend-tag
  replicas: 1

adminer:
  enabled: false

database:
  storage:
    size: 1Gi
    hostPath: /data/postgresql-qa
  backup:
    enabled: true

secrets:
  create: false
