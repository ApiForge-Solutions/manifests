environment: prod
appEnvironment: production

ingress:
  host: fastapi-prod.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-prod
backend:
  image:
    tag: "backend-84f95676"   # ci:backend-tag
  replicas: 2
frontend:
  image:
    tag: "frontend-84f95676"   # ci:frontend-tag
  replicas: 2

adminer:
  enabled: false
database:
  storage:
    size: 5Gi
    hostPath: /data/postgresql-prod
  backup:
    enabled: true

secrets:
  create: false
