environment: dev
appEnvironment: local

ingress:
  host: fastapi-dev.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-staging

backend:
  image:
    tag: "backend" # ci:backend-tag
  replicas: 1
frontend:
  image:
    tag: "frontend" # ci:frontend-tag
  replicas: 1

adminer:
  enabled: true

database:
  storage:
    size: 1Gi
    hostPath: /data/postgresql-dev 

secrets:
  create: false
