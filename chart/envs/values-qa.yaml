environment: qa
appEnvironment: staging

ingress:
  host: fastapi-qa.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-staging

backend:
  image:
    tag: "backend-84f95676"   # ci:backend-tag
  replicas: 1
frontend:
  image:
    tag: "frontend-84f95676"   # ci:frontend-tag
  replicas: 1

adminer:
  enabled: false

database:
  storage:
    size: 1Gi
    hostPath: /data/postgresql-qa

secrets:
  create: false
