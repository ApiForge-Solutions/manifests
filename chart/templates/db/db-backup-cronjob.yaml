{{- if .Values.database.backup.enabled }}
# Sauvegarde logique de PostgreSQL (pg_dump) vers MinIO.
# La rétention (7 jours) est appliquée côté MinIO par une règle de cycle de vie sur le bucket.
# Le Secret db-backup-s3 (S3_ACCESS_KEY, S3_SECRET_KEY) est créé par le pipeline Jenkins,
# comme db-secret : il n'est donc pas défini dans ce chart.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: {{ .Values.database.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: Never
          volumes:
            - name: dump
              emptyDir: {}
          initContainers:
            - name: dump
              image: {{ .Values.database.backup.dumpImage | quote }}
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  F="/dump/$(date -u +%Y%m%dT%H%M%SZ)-${POSTGRES_DB}.dump"
                  pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$F"
                  test -s "$F"
                  ls -lh /dump
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: POSTGRES_PASSWORD
              resources:
                {{- toYaml .Values.database.backup.resources | nindent 16 }}
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: upload
              image: {{ .Values.database.backup.uploadImage | quote }}
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  for f in /dump/*.dump; do
                    aws s3 cp "$f" "s3://$S3_BUCKET/$NAMESPACE/$(basename "$f")" --endpoint-url "$S3_ENDPOINT"
                  done
                  aws s3 ls "s3://$S3_BUCKET/$NAMESPACE/" --endpoint-url "$S3_ENDPOINT"
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.database.backup.s3.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.database.backup.s3.bucket | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-s3
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: db-backup-s3
                      key: S3_SECRET_KEY
              resources:
                {{- toYaml .Values.database.backup.resources | nindent 16 }}
              volumeMounts:
                - name: dump
                  mountPath: /dump
{{- end }}
