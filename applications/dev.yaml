apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # delete application resources when the application is deleted
spec:
  project: default
  source:
    repoURL: https://github.com/ApiForge-Solutions/manifests.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - envs/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
