environment: staging
appEnvironment: staging

ingress:
  host: fastapi-staging.apiforge.cloud-ip.cc
  clusterIssuer: letsencrypt-staging

backend:
  image:
    tag: "backend-84f95676"   # ci:backend-tag
  replicas: 2
frontend:
  image:
    tag: "frontend-84f95676"   # ci:frontend-tag
  replicas: 2

adminer:
  enabled: false

database:
  storage:
    size: 2Gi
    hostPath: /data/postgresql-staging

secrets:
  create: false
