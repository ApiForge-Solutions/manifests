apiVersion: batch/v1
kind: Job
metadata:
  name: prestart
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      containers:
        - name: prestart
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command:
            - bash
            - scripts/prestart.sh

          env:
            - name: DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DOMAIN

            - name: FRONTEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FRONTEND_HOST

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENVIRONMENT

            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_NAME

            - name: FIRST_SUPERUSER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FIRST_SUPERUSER

            - name: FIRST_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: FIRST_SUPERUSER_PASSWORD

            - name: BACKEND_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_CORS_ORIGINS

            - name: POSTGRES_SERVER
              value: db

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD

      restartPolicy: Never